# See https://github.com/zen-browser/desktop/issues/11599, this pref seems to
# have disabled itself on macos for some unknown reason.
# Make sure its in sync with:
# https://searchfox.org/firefox-main/rev/dd2579cb6e7f1761a27ce64fb84d92c61d85c27f/modules/libpref/init/StaticPrefList.yaml#8396
- name: gfx.webrender.compositor
  condition: "defined(XP_WIN) || defined(XP_DARWIN) || defined(MOZ_WIDGET_GTK)"
  value: "@cond"
  mirror: once

# Idle about:newtab on llvmpipe uses Software WebRender (SWGL). That
# rust backend rust-panics on the Renderer thread after ~2–3 minutes
# (MozCrashReason=explicit panic, SIGSEGV @ 0, dump 75aae051 / 0e5eaeb6).
# Force hardware WR onto the GL driver (mesa/llvmpipe) instead of SWGL.
- name: gfx.webrender.all
  value: true

- name: gfx.webrender.reject-software-driver
  condition: "defined(MOZ_WIDGET_GTK)"
  value: false

- name: gfx.webrender.software
  value: false

- name: layers.acceleration.force-enabled
  value: true
